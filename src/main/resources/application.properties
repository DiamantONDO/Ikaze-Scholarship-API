# --- MongoDB ---
# Local default; overridden by MONGODB_URI in production
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ikazescholarship}

# --- Server ---
# Render injects PORT; falls back to 8081 locally
server.port=${PORT:8081}

# --- CORS ---
# Comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- API docs (disable in production if you prefer) ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true